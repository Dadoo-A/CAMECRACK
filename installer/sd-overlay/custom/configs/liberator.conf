# CAMECRACK liberator: what does the SD card do at boot?
#   install   = install / update the no-SD mode into the flash (default)
#   off       = leave the flash alone (SD-only mode)
#   uninstall = remove the hook and /etc/config/camecrack (stock camera again without SD)
LIBERATOR=install

# Telnet on port 24 in no-SD mode = passwordless ROOT shell for anyone on your network.
# off (default, recommended) | on (developers / debugging only)
TELNET=off

# Password of the camera web page (Wi-Fi settings + PTZ), user "admin". Empty = no password.
# Avoid double quotes. Put the same value in CAM_WEB_PASSWORD in the PC tool .env.
WEB_PASSWORD=""

# Time zone shown by the camera (video overlay, logs), as a POSIX TZ string. Empty = UTC.
#   Paris/Berlin/Madrid/Rome: CET-1CEST,M3.5.0,M10.5.0/3   London: GMT0BST,M3.5.0/1,M10.5.0
#   New York: EST5EDT,M3.2.0,M11.1.0   Los Angeles: PST8PDT,M3.2.0,M11.1.0   Tokyo: JST-9
TIMEZONE="CET-1CEST,M3.5.0,M10.5.0/3"
